<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Brain is a private, offline personal assistant. Reminders, tasks, notes, money, photos, and journal entries stay on your device.">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brain">
<meta name="brain-instagram-app-id" content="">
<meta name="brain-instagram-exchange" content="">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://graph.facebook.com https://*.facebook.com https://*.supabase.co https://*.amazonaws.com https://*.r2.cloudflarestorage.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.facebook.com; frame-ancestors 'none'; worker-src 'self';">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Brain — private assistant</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">

    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand" aria-label="Brain, private on this device">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v.3a2.5 2.5 0 0 0-2 4 2.5 2.5 0 0 0 .5 4.5A2.5 2.5 0 0 0 7 17.5V18a2.5 2.5 0 0 0 5 .5V4.5A2.5 2.5 0 0 0 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 1 17 4.5v.3a2.5 2.5 0 0 1 2 4 2.5 2.5 0 0 1-.5 4.5A2.5 2.5 0 0 1 17 17.5V18a2.5 2.5 0 0 1-5 .5V4.5A2.5 2.5 0 0 1 14.5 2Z"/></svg></div>
        <div>
          <h1>Brain</h1>
          <div class="sub"><i class="idot" aria-hidden="true"></i><span>private · on this device</span></div>
        </div>
      </div>
      <div class="nav-label">Workspace</div>
      <h1 class="visually-hidden" id="title">Brain</h1>
      <nav id="sidenav" aria-label="Workspace views"></nav>
      <div class="sidebar-foot">
        <div class="nav-label">Tools</div>
        <div id="sidetools"></div>
        <p class="note">Stored locally. Exports and chosen external actions can share data.</p>
      </div>
    </aside>

    <div class="maincol">
      <header class="topbar">
        <span class="brand-text" aria-hidden="true">Brain</span>
        <span class="topbar-page" id="topbarTitle">Home</span>
        <div class="spacer"></div>
        <button class="iconbtn" id="themeBtn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        <button class="iconbtn" id="installBtn" type="button" title="Install Brain" aria-label="Install Brain" hidden aria-hidden="true"></button>
        <button class="iconbtn" id="menuBtn" type="button" title="Menu" aria-label="Open menu" aria-controls="sheet" aria-expanded="false"></button>
      </header>

      <main id="main" class="content" tabindex="-1">
        <section id="view-home" class="view" aria-label="Home"></section>

        <section id="view-assistant" class="view assistant-view" aria-label="Brain assistant" hidden>
          <div class="chat-scroll">
            <div id="chat" aria-live="polite" aria-relevant="additions text" role="log" tabindex="0"></div>
          </div>
          <div id="composer">
            <div class="composer-inner">
              <div class="suggests" id="suggests" aria-label="Suggestions"></div>
              <div class="bar">
                <textarea id="in" rows="1" aria-label="Message Brain" placeholder="Message Brain… e.g. “remind me to call mom at 7pm”" enterkeyhint="send" autocomplete="off"></textarea>
                <button class="rbtn" id="mic" type="button" title="Voice input" aria-label="Voice input"> </button>
                <button id="send" type="button" title="Send message" aria-label="Send message"> </button>
              </div>
            </div>
          </div>
        </section>

        <section id="view-calendar" class="view" aria-label="Calendar" hidden></section>
        <section id="view-more" class="view" aria-label="More modules" hidden></section>
        <section id="view-module" class="view" aria-label="Module" hidden></section>
      </main>

      <nav id="bottomnav" class="bottomnav" aria-label="Primary mobile navigation">
        <div class="bottomnav-inner" id="bottomnavInner"></div>
      </nav>
    </div>
  </div>
</div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" tabindex="-1">
    <div class="panel" role="document">
      <div class="grip" aria-hidden="true"></div>
      <div class="phead"><h2 id="sheetTitle">Menu</h2><button class="xbtn" id="sheetClose" type="button" aria-label="Close panel"> </button></div>
      <div class="pbody" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
