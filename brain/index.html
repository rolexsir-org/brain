<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Brain — private assistant</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand" aria-label="Brain, private on this device">
      <div class="mark" aria-hidden="true">🧠</div>
      <div>
        <h1 id="title">Brain</h1>
        <div class="sub"><i class="idot" aria-hidden="true"></i><span>private · on this device</span></div>
      </div>
    </div>
    <button class="iconbtn" id="installBtn" type="button" title="Install Brain" aria-label="Install Brain" hidden aria-hidden="true">⬇️</button>
    <button class="iconbtn" id="menuBtn" type="button" title="Menu" aria-label="Open menu" aria-controls="sheet" aria-expanded="false">☰</button>
  </header>

  <main id="chat" aria-live="polite" aria-relevant="additions text" role="log" tabindex="0"></main>

  <div id="composer">
    <div class="suggests" id="suggests" aria-label="Suggestions"></div>
    <div class="bar">
      <textarea id="in" rows="1" aria-label="Message Brain" placeholder="Message Brain… e.g. “remind me to call mom at 7pm”" enterkeyhint="send" autocomplete="off"></textarea>
      <button class="rbtn" id="mic" type="button" title="Voice input" aria-label="Voice input">🎤</button>
      <button id="send" type="button" title="Send message" aria-label="Send message">➤</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" tabindex="-1">
  <div class="panel" role="document">
    <div class="grip" aria-hidden="true"></div>
    <div class="phead"><h2 id="sheetTitle">Menu</h2><button class="xbtn" id="sheetClose" type="button" aria-label="Close panel">×</button></div>
    <div class="pbody" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
